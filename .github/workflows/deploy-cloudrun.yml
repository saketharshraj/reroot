# Deploy the API to Cloud Run on every push to main that touches the backend.
# Keyless: GitHub's OIDC token is exchanged via Workload Identity Federation for the
# github-deployer service account (only this repo's main branch is trusted).
name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".github/workflows/deploy-cloudrun.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudrun-api
  cancel-in-progress: true

env:
  PROJECT: reroot-hack-2026
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/reroot-hack-2026/cloud-run-source-deploy/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/152511810602/locations/global/workloadIdentityPools/github/providers/reroot-repo
          service_account: github-deployer@reroot-hack-2026.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      # Only the image changes; env vars, service account, memory etc. stay as configured.
      - name: Deploy
        run: gcloud run deploy api --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project "$PROJECT" --quiet

      - name: Smoke test
        run: curl -fsS "https://api-152511810602.us-central1.run.app/health?deep=true"
