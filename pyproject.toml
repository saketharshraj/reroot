[project]
name = "reroot"
version = "0.1.0"
description = "ReRoot: plant trees where they will survive, then prove they did"
authors = [
    { name = "Harsh Raj", email = "saketharshraj@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "earthengine-api>=1.7.48",
    "fastapi>=0.143.1",
    "google-auth>=2.62.0",
    "google-cloud-bigquery>=3.46.1",
    "google-cloud-pubsub>=2.42.0",
    "google-cloud-run>=0.16.2",
    "google-cloud-storage>=3.17.0",
    "google-cloud-texttospeech>=2.38.0",
    "google-genai>=2.30.1",
    "pillow>=12.3.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
