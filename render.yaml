# Render Blueprint for the ReRoot API (free plan, Docker).
# Secrets (sync:false, secret files) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: reroot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLOUD_PROJECT
        value: reroot-hack-2026
      - key: SERVICE_MODULE
        value: reroot.api.main:app
      # Upload the service-account key as a Secret File named gcp-key.json (Render mounts
      # secret files at /etc/secrets/<name>); ADC then picks it up.
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-key.json
      - key: ALLOWED_ORIGINS
        sync: false
