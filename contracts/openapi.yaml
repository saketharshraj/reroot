openapi: 3.1.0
info:
  title: ReRoot API
  version: 0.1.0
  description: >
    Backend for the ReRoot web app. All geometries are GeoJSON in EPSG:4326.
    Every numeric result carries `sources` (Earth Engine dataset IDs or BigQuery tables)
    so the UI can show where each number came from.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Liveness plus dependency checks
      responses:
        "200": { description: OK }

  /v1/regions:
    get:
      summary: Regions with a precomputed grid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    bbox: { type: array, items: { type: number }, description: "[west, south, east, north]" }

  /v1/layers/{layer}:
    get:
      summary: XYZ tile URL for a map layer over a region
      parameters:
        - { name: layer, in: path, required: true, schema: { enum: [true_colour, ndvi, land_cover, similarity, rainfall, slope] } }
        - { name: region, in: query, schema: { type: string, default: aravalli_ggn_fbd } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  tile_url: { type: string, description: "XYZ template with {z}/{x}/{y}" }
                  legend: { type: object }
                  sources: { type: array, items: { type: string } }

  /v1/assess:
    post:
      summary: Impact of clearing a project footprint
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [geometry]
              properties:
                geometry: { $ref: "#/components/schemas/Geometry" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  area_ha: { type: number }
                  tree_cover_ha: { type: number }
                  forest_like_ha: { type: number, description: "trees + scrub, stand-in for notified forest land" }
                  land_cover_ha: { type: object, additionalProperties: { type: number } }
                  canopy_height_mean_m: { type: [number, "null"] }
                  agb_t: { type: [number, "null"], description: "above-ground biomass, GEDI L4B mean density x area" }
                  carbon_t_est: { type: [number, "null"] }
                  co2e_t_est: { type: [number, "null"] }
                  offset_required_ha: { type: number, description: "1:1 on non-forest land" }
                  offset_required_ha_degraded: { type: number, description: "2:1 on degraded forest land" }
                  sources: { type: array, items: { type: string } }

  /v1/sites/search:
    post:
      summary: Rank candidate planting sites
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [project_geometry, area_ha_needed]
              properties:
                project_geometry: { $ref: "#/components/schemas/Geometry" }
                area_ha_needed: { type: number }
                radius_km: { type: number, default: 30 }
                exclude: { type: array, items: { enum: [farmland, built, water, grassland, steep, protected] }, default: [farmland, built, water, grassland, steep] }
                weights: { type: object, additionalProperties: { type: number }, description: "establishment, water, connectivity, people, terrain (0-5)" }
                region: { type: string, default: aravalli_ggn_fbd }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: string }
                  sites:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
                  area_ha_selected: { type: number }
                  cells_considered: { type: integer }
                  cells_excluded: { type: object, additionalProperties: { type: integer }, description: "reason -> cell count" }

  /v1/agent/chat:
    post:
      summary: Gemini agent turn. Streams Server-Sent Events.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                session_id: { type: string }
                message: { type: string }
                map_context: { type: object, description: "current viewport, selected geometry" }
      responses:
        "200":
          description: >
            text/event-stream. Each event is JSON with `type` in
            [thinking, tool_call, tool_result, map_layer, sites, text, done].

  /v1/plantations:
    get:
      summary: List monitored plantations with latest health
  /v1/plantations/{id}/timeseries:
    get:
      summary: NDVI vs expected, soil moisture, rainfall

  /v1/verify-photo:
    post:
      summary: Caretaker photo check (Gemini vision + GPS vs polygon)
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                plantation_id: { type: string }
                photo: { type: string, format: binary }
                lat: { type: number }
                lon: { type: number }

components:
  schemas:
    Geometry:
      type: object
      description: GeoJSON Polygon or MultiPolygon
    Site:
      type: object
      properties:
        site_id: { type: string }
        rank: { type: integer }
        geometry: { $ref: "#/components/schemas/Geometry" }
        centroid: { type: array, items: { type: number }, description: "[lon, lat]" }
        area_ha: { type: number }
        final_score: { type: number, description: "0..1 weighted suitability" }
        breakdown: { type: object, additionalProperties: { type: number }, description: "per-factor 0..1" }
        conditions: { type: object, additionalProperties: { type: number }, description: "mean slope, rain, distances, fractions, ml_score" }
        species:
          type: array
          items:
            type: object
            properties: { name: { type: string }, local: { type: string }, why: { type: string } }
        rationale: { type: string }
        sources: { type: array, items: { type: string } }
